<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบเก็บเงินห้อง</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="header">
    <span class="header-title">เงินห้อง</span>
    <div class="header-right">
      <button class="btn-sm" id="themeBtn">🌙 Dark</button>
      <a class="btn-sm" href="student.html">👤 ของฉัน</a>
      <a class="btn-sm" href="admin.html">Admin →</a>
    </div>
  </header>

  <!-- ═══ MAIN CONTENT ═══ -->
  <div class="wrap">

    <!-- Loading -->
    <div class="loading-wrap" id="loadWrap">
      <div class="spinner"></div>
      กำลังโหลดข้อมูล…
    </div>

    <!-- รายชื่อ (ซ่อนไว้จนกว่าจะโหลดเสร็จ) -->
    <div id="memberContent" style="display:none">

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-val" id="stTotal">—</div>
          <div class="stat-lbl">ทั้งหมด</div>
        </div>
        <div class="stat-card">
          <div class="stat-val green" id="stPaid">—</div>
          <div class="stat-lbl">จ่ายสัปดาห์นี้</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stLeft">—</div>
          <div class="stat-lbl">รอจ่าย</div>
        </div>
      </div>
      <div class="week-indicator">
        📅 <span id="weekLabel">กำลังโหลด…</span>
      </div>
      <div class="sum-banner">
        <span class="sum-banner-lbl">ยอดรวมที่เก็บได้</span>
        <span class="sum-banner-val green" id="stSum">฿0</span>
      </div>

      <!-- รายชื่อ -->
      <div class="sec-lbl">
        <span class="live-dot"></span>
        รายชื่อทั้งหมด
      </div>
      <div class="member-list" id="memberList"></div>

    </div>
  </div>

  <!-- ═══ QR MODAL ═══ -->
  <div class="overlay" id="qrOverlay">
    <div class="modal-card">
      <button class="modal-x" id="modalX">✕</button>
      <div class="modal-badge" id="mNum"></div>
      <div class="modal-name"  id="mName"></div>
      <div class="modal-amt"   id="mAmt"></div>
      <div class="modal-hint" id="mHint">สแกน QR เพื่อโอนเงิน</div>
      <div class="qr-wrap" id="qrWrap">
        <img id="qrImg" src="" alt="QR Code" style="display:none" />
        <div id="qrNoImg" class="qr-none-msg">
          <span style="font-size:28px">📷</span>
          <span style="font-size:13px">Admin ยังไม่ได้อัปโหลด QR</span>
        </div>
        <div class="qr-scanned-overlay" id="qrScanned" style="display:none">
          <div class="qr-scanned-check">✓</div>
          <div class="qr-scanned-text">สแกนแล้ว</div>
        </div>
      </div>
      <div class="week-list" id="weekList"></div>
      <div id="modalAction"></div>
    </div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div class="toast-wrap" id="toastWrap">
    <div class="toast-inner" id="toastMsg"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
