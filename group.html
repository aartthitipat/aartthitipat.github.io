<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CheckGroup — กลุ่ม</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ── Navbar ── -->
  <nav class="navbar" id="navbar" style="display:none;"></nav>

  <!-- ── Join Overlay ── -->
  <div id="joinOverlay" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:500; overflow-y:auto;">
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;">
      <div style="width:100%; max-width:420px; animation: fadeUp 0.4s ease;">
        <div class="card" style="text-align:center; padding:40px 32px;">
          <div id="joinGroupEmoji" style="font-size:3.5rem; margin-bottom:12px;">📋</div>
          <p style="font-size:0.78rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">คุณถูกเชิญเข้ากลุ่ม</p>
          <h2 id="joinGroupName" style="font-size:1.5rem; margin-bottom:6px;">กำลังโหลด...</h2>
          <p id="joinGroupDesc" style="color:var(--text-muted); font-size:0.85rem; margin-bottom:28px; min-height:18px;"></p>

          <div style="text-align:left; display:flex; flex-direction:column; gap:16px;">
            <div class="form-group">
              <label class="form-label">ชื่อของคุณ</label>
              <input class="form-input" type="text" id="joinName"
                placeholder="ใส่ชื่อที่ต้องการให้แสดง..." maxlength="40" />
              <span class="form-error" id="joinNameError" style="display:none;"></span>
            </div>

            <div class="form-group" id="joinCodeWrap" style="display:none;">
              <label class="form-label">โค้ดเชิญ</label>
              <input class="form-input" type="text" id="joinCodeInput"
                placeholder="XXXXXX" maxlength="6"
                style="text-transform:uppercase; letter-spacing:4px; font-family:'DM Mono',monospace;" />
              <span class="form-error" id="joinCodeError" style="display:none;"></span>
            </div>

            <button class="btn btn--primary btn--lg btn--full" id="joinBtn" onclick="handleJoin()">
              เข้าร่วมกลุ่ม →
            </button>
            <p style="text-align:center; font-size:0.78rem; color:var(--text-dim);">
              ชื่อนี้จะแสดงให้หัวหน้ากลุ่มเห็น
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Error Screen ── -->
  <div id="errorScreen" style="display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; text-align:center; padding:24px; min-height:100vh;">
    <div style="font-size:4rem;">🔒</div>
    <h2 id="errorTitle">ไม่พบกลุ่ม</h2>
    <p id="errorMsg" style="color:var(--text-muted);">ลิงก์ไม่ถูกต้องหรือกลุ่มถูกลบแล้ว</p>
    <a href="dashboard.html" class="btn btn--ghost">กลับหน้าหลัก</a>
  </div>

  <!-- ── Main Content ── -->
  <div id="mainContent" style="display:none;">

    <!-- Hero -->
    <div class="group-hero" id="groupHero">
      <div style="max-width:1100px; margin:0 auto;">
        <a href="dashboard.html" class="group-hero__back" id="heroBack" style="display:none;">← กลับ Dashboard</a>
        <div class="group-hero__top">
          <div>
            <div class="group-hero__title-row">
              <div class="group-hero__icon" id="heroIcon">📋</div>
              <div>
                <h1 class="group-hero__name" id="heroName"></h1>
                <div class="group-hero__meta" id="heroMeta"></div>
              </div>
            </div>
          </div>
          <div id="heroRight" style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;"></div>
        </div>
      </div>
    </div>

    <!-- ── Owner View ── -->
    <div id="ownerView" style="display:none;">
      <div style="max-width:1100px; margin:0 auto; padding:28px 32px 48px;">

        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
          <div class="section-title">👥 สมาชิก <span id="memberCount"></span></div>
          <div style="font-size:0.8rem; color:var(--text-dim);">พิมพ์รายการในช่องของแต่ละสมาชิก แล้วกด Enter</div>
        </div>

        <div class="checklist-grid" id="ownerMemberGrid"></div>
      </div>
    </div>

    <!-- ── Member View ── -->
    <div id="memberView" style="display:none;">
      <div style="max-width:600px; margin:24px auto 48px; padding:0 24px;">

        <!-- Member Header Card -->
        <div class="card" style="padding:24px 28px; margin-bottom:16px;">
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
            <div>
              <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:3px;">สวัสดี!</p>
              <h2 id="memberGreetName" style="font-size:1.3rem;"></h2>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn--ghost btn--sm" onclick="handleReset()">🔄 รีเซ็ต</button>
              <button class="btn btn--danger btn--sm" onclick="handleLeave()">🚪 ออกจากกลุ่ม</button>
            </div>
          </div>
          <div id="memberProgressBar"></div>
        </div>

        <!-- Checklist -->
        <div id="memberChecklist"></div>

      </div>
    </div>

  </div><!-- /mainContent -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ── Modal: Delete Group ── -->
  <div class="modal-overlay" id="modalDelGroup" style="display:none;">
    <div class="modal">
      <div class="modal__header">
        <h3 style="color:var(--danger);">⚠️ ลบกลุ่ม?</h3>
        <button class="modal__close" onclick="closeModal('modalDelGroup')">✕</button>
      </div>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:8px;">
        ต้องการลบกลุ่มนี้ถาวรใช่ไหม? <strong style="color:var(--danger);">ไม่สามารถกู้คืนได้</strong>
      </p>
      <div class="modal__footer">
        <button class="btn btn--ghost" onclick="closeModal('modalDelGroup')">ยกเลิก</button>
        <button class="btn btn--danger" onclick="confirmDeleteGroup()">ลบกลุ่มถาวร</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script>
    // ── State ────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const groupId = params.get('id');
    const codeFromUrl = (params.get('code') || '').toUpperCase();

    let group = null;
    let isOwner = false;
    let myMemberId = null;
    let myMember = null;

    // ── Init ─────────────────────────────────────────────────
    async function init() {
      if (!groupId) { showError('ไม่พบกลุ่ม', 'URL ไม่ถูกต้อง'); return; }

      group = await DB.findGroupById(groupId);
      if (!group) { showError('ไม่พบกลุ่มนี้', 'อาจถูกลบแล้ว หรือ URL ไม่ถูกต้อง'); return; }

      const currentUser = DB.getCurrentUser();

      // เจ้าของที่ login แล้ว
      if (currentUser) {
        const isAdmin = Auth.isAdmin(currentUser);
        if (group.ownerId === currentUser.id || isAdmin) {
          isOwner = true;
          myMemberId = currentUser.id;
          myMember = group.members.find(m => m.id === myMemberId);
          if (!myMember) {
            myMember = { id: myMemberId, displayName: currentUser.username, isOwner: true, progress: {}, items: [] };
            group.members.push(myMember);
            await DB.updateGroupData(group);
          }
          document.getElementById('navbar').style.display = '';
          Auth.renderNavbar(currentUser);
          document.getElementById('heroBack').style.display = '';
          showMainContent();
          renderOwnerView();
          return;
        }
      }

      // สมาชิกที่เคยเข้าร่วมแล้ว
      const session = DB.getMemberSession(groupId);
      if (session) {
        const member = group.members.find(m => m.id === session.memberId);
        if (member) {
          myMemberId = session.memberId;
          myMember = member;
          showMainContent();
          renderMemberView();
          return;
        }
        DB.clearMemberSession(groupId);
      }

      showJoinOverlay();
    }

    // ── Helpers ──────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function reloadGroup() {
      group = await DB.findGroupById(groupId);
      if (myMemberId) {
        myMember = group.members.find(m => m.id === myMemberId) || myMember;
      }
    }

    function showError(title, msg) {
      document.getElementById('errorTitle').textContent = title;
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('errorScreen').style.display = 'flex';
    }

    function showJoinOverlay() {
      document.getElementById('joinGroupEmoji').textContent = group.emoji;
      document.getElementById('joinGroupName').textContent = group.name;
      document.getElementById('joinGroupDesc').textContent = group.description || '';
      if (!codeFromUrl || codeFromUrl !== group.inviteCode) {
        document.getElementById('joinCodeWrap').style.display = '';
      }
      document.getElementById('joinOverlay').style.display = '';
      setTimeout(() => document.getElementById('joinName').focus(), 200);
    }

    function showMainContent() {
      document.getElementById('joinOverlay').style.display = 'none';
      document.getElementById('mainContent').style.display = '';
      renderHero();
    }

    // ── Join ─────────────────────────────────────────────────
    async function handleJoin() {
      const name = document.getElementById('joinName').value.trim();
      const nameErr = document.getElementById('joinNameError');
      const codeWrap = document.getElementById('joinCodeWrap');
      const codeInput = document.getElementById('joinCodeInput');
      const codeErr = document.getElementById('joinCodeError');

      nameErr.style.display = 'none';
      if (codeErr) codeErr.style.display = 'none';

      if (!name) {
        nameErr.textContent = 'กรุณาใส่ชื่อของคุณ';
        nameErr.style.display = 'flex';
        document.getElementById('joinName').focus();
        return;
      }

      let verifiedCode = codeFromUrl;
      if (codeWrap.style.display !== 'none') {
        verifiedCode = codeInput.value.trim().toUpperCase();
        if (!verifiedCode || verifiedCode.length !== 6) {
          codeErr.textContent = 'กรุณากรอกโค้ดเชิญ 6 หลัก';
          codeErr.style.display = 'flex';
          return;
        }
        if (verifiedCode !== group.inviteCode) {
          codeErr.textContent = 'โค้ดเชิญไม่ถูกต้อง';
          codeErr.style.display = 'flex';
          return;
        }
      } else if (codeFromUrl !== group.inviteCode) {
        showError('โค้ดเชิญไม่ถูกต้อง', 'ขอโค้ดใหม่จากเจ้าของกลุ่ม');
        return;
      }

      const btn = document.getElementById('joinBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังเข้าร่วม...';

      const result = await DB.joinGroupAnonymous(groupId, name);
      if (result.success) {
        DB.setMemberSession(groupId, { memberId: result.memberId, displayName: result.displayName });
        myMemberId = result.memberId;
        group = await DB.findGroupById(groupId);
        myMember = group.members.find(m => m.id === myMemberId);
        showMainContent();
        renderMemberView();
      } else {
        Auth.showToast(result.error, 'error');
        btn.disabled = false;
        btn.textContent = 'เข้าร่วมกลุ่ม →';
      }
    }

    // ── Hero ─────────────────────────────────────────────────
    function renderHero() {
      document.title = `${group.name} — CheckGroup`;
      document.getElementById('heroIcon').textContent = group.emoji;
      document.getElementById('heroName').textContent = group.name;

      const stats = DB.getGroupStats(group);
      document.getElementById('heroMeta').innerHTML = `
        <div class="group-hero__chip">👥 ${stats.memberCount} สมาชิก</div>
        <div class="group-hero__chip">📝 ${stats.total} รายการ</div>
        ${group.description ? `<div class="group-hero__chip">${escapeHtml(group.description)}</div>` : ''}
      `;

      const right = document.getElementById('heroRight');
      if (isOwner) {
        right.innerHTML = `
          <div class="invite-code">
            <div>
              <div class="invite-code__label">🔑 โค้ดเชิญ</div>
              <div class="invite-code__value" id="inviteCodeDisplay">${group.inviteCode}</div>
            </div>
            <button class="btn btn--ghost btn--sm" onclick="copyInviteLink()" title="คัดลอกลิงก์เชิญ">🔗</button>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn--ghost btn--sm" onclick="regenerateCode()">🔄 โค้ดใหม่</button>
            <button class="btn btn--danger btn--sm" onclick="openModal('modalDelGroup')">🗑️ ลบกลุ่ม</button>
          </div>
        `;
      } else if (myMember) {
        right.innerHTML = `
          <div style="text-align:right;">
            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:2px;">เข้าสู่กลุ่มในฐานะ</div>
            <div style="font-weight:700; font-size:1.05rem;">${escapeHtml(myMember.displayName)}</div>
          </div>
        `;
      }
    }

    function copyInviteLink() {
      const link = `${location.origin}${location.pathname}?id=${groupId}&code=${group.inviteCode}`;
      navigator.clipboard.writeText(link).then(() => {
        Auth.showToast('คัดลอกลิงก์เชิญแล้ว!', 'success');
      }).catch(() => {
        Auth.showToast('โค้ด: ' + group.inviteCode, '');
      });
    }

    async function regenerateCode() {
      const result = await DB.regenerateInviteCode(groupId, DB.getCurrentUser().id);
      if (result.success) {
        group.inviteCode = result.code;
        document.getElementById('inviteCodeDisplay').textContent = result.code;
        Auth.showToast('สร้างโค้ดใหม่แล้ว: ' + result.code, 'success');
      } else {
        Auth.showToast(result.error, 'error');
      }
    }

    // ── Owner View ───────────────────────────────────────────
    function renderOwnerView() {
      document.getElementById('ownerView').style.display = '';
      document.getElementById('memberView').style.display = 'none';
      renderMemberCards();
    }

    function renderMemberCards() {
      const nonOwners = group.members.filter(m => !m.isOwner);
      document.getElementById('memberCount').textContent = `(${nonOwners.length})`;
      const grid = document.getElementById('ownerMemberGrid');

      if (nonOwners.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-state__icon">👥</div>
            <h3>ยังไม่มีสมาชิก</h3>
            <p style="margin-bottom:20px;">แชร์ลิงก์เชิญให้เพื่อนเข้ากลุ่ม</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = nonOwners.map((member, i) => renderMemberCard(member, i)).join('');
      attachMemberCardEvents();
    }

    function renderMemberCard(member, index) {
      const items = Array.isArray(member.items) ? member.items : [];
      const ms = DB.getMemberStats(group, member.id);
      const pct = ms.total > 0 ? Math.round((ms.done / ms.total) * 100) : 0;
      const color = pct === 100 ? 'var(--success)' : pct >= 50 ? 'var(--accent)' : 'var(--purple)';
      const initial = member.displayName.charAt(0).toUpperCase();

      const itemsHtml = items.map(item => `
        <div class="checklist-item ${item.done ? 'is-checked' : ''}">
          <div style="width:16px; height:16px; border-radius:4px; flex-shrink:0; border:2px solid ${item.done ? 'var(--success)' : 'var(--border-light)'}; background:${item.done ? 'var(--success)' : 'transparent'}; display:flex; align-items:center; justify-content:center;">
            ${item.done ? '<span style="color:#0d0d14; font-size:9px; font-weight:800; line-height:1;">✓</span>' : ''}
          </div>
          <div class="item-text" style="flex:1; font-size:0.88rem;">${escapeHtml(item.text)}</div>
          <button class="btn btn--icon item-delete"
            style="width:24px; height:24px; font-size:11px; opacity:0; color:var(--danger); background:var(--danger-dim); border:1px solid rgba(240,82,82,0.2);"
            data-del-member="${member.id}" data-del-item="${item.id}"
            onclick="event.stopPropagation();">✕</button>
        </div>
      `).join('');

      return `
        <div class="category-card" style="animation-delay:${index * 0.06}s;">
          <div class="category-header">
            <div class="category-header__left" style="gap:12px;">
              <div style="width:34px; height:34px; border-radius:50%; background:var(--accent-dim); border:2px solid rgba(245,166,35,0.3); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:var(--accent); flex-shrink:0;">${initial}</div>
              <div>
                <div class="category-name" style="font-size:1rem;">${escapeHtml(member.displayName)}</div>
                <div style="font-size:0.72rem; color:var(--text-muted); margin-top:1px;">${ms.done}/${ms.total} รายการ · ${pct}%</div>
              </div>
            </div>
            <button class="btn btn--icon" style="width:28px; height:28px; font-size:12px; color:var(--danger); background:var(--danger-dim); border:1px solid rgba(240,82,82,0.2); opacity:0; transition:opacity var(--transition);"
              onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=0"
              onclick="removeMember('${member.id}','${escapeHtml(member.displayName)}')"
              title="นำสมาชิกออก">✕</button>
          </div>

          ${ms.total > 0 ? `
            <div style="padding:0 16px 2px;">
              <div style="height:3px; background:var(--surface-3); border-radius:99px; overflow:hidden;">
                <div style="height:100%; width:${pct}%; background:${color}; border-radius:99px; transition:width 0.5s ease;"></div>
              </div>
            </div>
          ` : ''}

          <div class="category-items">
            ${itemsHtml}
            ${items.length === 0
              ? '<div style="padding:10px 12px; color:var(--text-dim); font-size:0.82rem; text-align:center;">ยังไม่มีรายการ</div>'
              : ''}
          </div>

          <div class="add-item-row">
            <input class="add-item-input" type="text"
              placeholder="+ พิมพ์รายการแล้วกด Enter..."
              data-member-id="${member.id}" maxlength="120" />
          </div>
        </div>
      `;
    }

    function attachMemberCardEvents() {
      document.querySelectorAll('.add-item-input[data-member-id]').forEach(input => {
        input.addEventListener('keydown', async e => {
          if (e.key !== 'Enter') return;
          const text = input.value.trim();
          if (!text) return;
          const memberId = input.dataset.memberId;

          const result = await DB.addMemberItem(groupId, myMemberId, memberId, text);
          if (result.success) {
            input.value = '';
            await reloadGroup();
            renderMemberCards();
            renderHero();
            setTimeout(() => {
              const inp = document.querySelector(`.add-item-input[data-member-id="${memberId}"]`);
              if (inp) inp.focus();
            }, 50);
          } else {
            Auth.showToast(result.error, 'error');
          }
        });
      });

      document.querySelectorAll('[data-del-member]').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          const result = await DB.deleteMemberItem(groupId, myMemberId, btn.dataset.delMember, btn.dataset.delItem);
          if (result.success) {
            await reloadGroup();
            renderMemberCards();
            renderHero();
          } else {
            Auth.showToast(result.error, 'error');
          }
        });
      });
    }

    async function removeMember(memberId, displayName) {
      if (!confirm(`ต้องการนำ "${displayName}" ออกจากกลุ่มใช่ไหม?`)) return;
      const result = await DB.removeMember(groupId, myMemberId, memberId);
      if (result.success) {
        Auth.showToast('นำสมาชิกออกแล้ว', 'success');
        await reloadGroup();
        renderHero();
        renderMemberCards();
      } else {
        Auth.showToast(result.error, 'error');
      }
    }

    // ── Member View ──────────────────────────────────────────
    function renderMemberView() {
      document.getElementById('ownerView').style.display = 'none';
      document.getElementById('memberView').style.display = '';
      renderMemberHeader();
      renderMemberChecklist();
    }

    function renderMemberHeader() {
      if (!myMember) return;
      const ms = DB.getMemberStats(group, myMemberId);
      const pct = ms.total > 0 ? Math.round((ms.done / ms.total) * 100) : 0;
      const color = pct === 100 ? 'var(--success)' : pct >= 50 ? 'var(--accent)' : 'var(--purple)';

      document.getElementById('memberGreetName').textContent = myMember.displayName;
      document.getElementById('memberProgressBar').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:0.83rem; color:var(--text-muted);">รายการของคุณ</span>
          <span style="font-weight:700; font-size:0.95rem; color:${color};">${ms.done}/${ms.total} รายการ (${pct}%)</span>
        </div>
        <div style="height:8px; background:var(--surface-3); border-radius:99px; overflow:hidden;">
          <div style="height:100%; width:${pct}%; background:${color}; border-radius:99px; transition:width 0.6s ease;"></div>
        </div>
        ${pct === 100 && ms.total > 0
          ? '<div style="text-align:center; margin-top:10px; font-size:0.88rem; color:var(--success);">🎉 ครบทุกรายการแล้ว!</div>'
          : ''}
        ${ms.total === 0
          ? '<div style="text-align:center; margin-top:10px; font-size:0.83rem; color:var(--text-dim);">รอเจ้าของกลุ่มเพิ่มรายการให้คุณ...</div>'
          : ''}
      `;
    }

    function renderMemberChecklist() {
      if (!myMember) return;
      const container = document.getElementById('memberChecklist');
      const items = Array.isArray(myMember.items) ? myMember.items : [];

      if (items.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:48px 24px; color:var(--text-muted);">
            <div style="font-size:3rem; margin-bottom:12px;">📋</div>
            <p style="font-weight:600; margin-bottom:6px;">ยังไม่มีรายการ</p>
            <p style="font-size:0.83rem; color:var(--text-dim);">รอเจ้าของกลุ่มเพิ่มรายการให้คุณ</p>
          </div>
        `;
        return;
      }

      const itemsHtml = items.map(item => `
        <div class="checklist-item ${item.done ? 'is-checked' : ''}" style="cursor:pointer;"
          onclick="toggleMyItem('${item.id}')">
          <input type="checkbox" class="item-checkbox" ${item.done ? 'checked' : ''}
            onclick="event.stopPropagation(); toggleMyItem('${item.id}')" />
          <div class="item-text">${escapeHtml(item.text)}</div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="card" style="padding:0; overflow:hidden; animation: fadeUp 0.3s ease;">
          <div class="category-header">
            <div class="category-header__left">
              <div class="category-name">รายการของฉัน</div>
              <div class="category-count">${items.filter(i => i.done).length}/${items.length}</div>
            </div>
          </div>
          <div class="category-items">${itemsHtml}</div>
        </div>
      `;
    }

    async function toggleMyItem(itemId) {
      const result = await DB.toggleMemberItem(groupId, myMemberId, itemId);
      if (result.success) {
        await reloadGroup();
        renderMemberHeader();
        renderMemberChecklist();
        renderHero();
      } else {
        Auth.showToast(result.error, 'error');
      }
    }

    async function handleReset() {
      if (!confirm('ต้องการรีเซ็ตรายการทั้งหมดของคุณใช่ไหม?')) return;
      const result = await DB.resetMemberProgress(groupId, myMemberId);
      if (result.success) {
        Auth.showToast('รีเซ็ตแล้ว', 'success');
        await reloadGroup();
        renderMemberHeader();
        renderMemberChecklist();
      } else {
        Auth.showToast(result.error, 'error');
      }
    }

    async function handleLeave() {
      if (!confirm('ต้องการออกจากกลุ่มนี้ใช่ไหม? Progress ของคุณจะถูกลบ')) return;
      const result = await DB.leaveGroup(groupId, myMemberId);
      if (result.success) {
        DB.clearMemberSession(groupId);
        Auth.showToast('ออกจากกลุ่มแล้ว', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } else {
        Auth.showToast(result.error, 'error');
      }
    }

    // ── Modals ────────────────────────────────────────────────
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay.id); });
    });

    async function confirmDeleteGroup() {
      const result = await DB.deleteGroup(groupId, myMemberId);
      if (result.success) {
        Auth.showToast('ลบกลุ่มแล้ว', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } else {
        Auth.showToast(result.error, 'error');
        closeModal('modalDelGroup');
      }
    }

    // ── Auto-refresh ──────────────────────────────────────────
    window.addEventListener('focus', async () => {
      if (!group) return;
      await reloadGroup();
      renderHero();
      if (isOwner) renderMemberCards();
      else { renderMemberHeader(); renderMemberChecklist(); }
    });

    document.getElementById('joinName').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleJoin();
    });

    // ── Start ─────────────────────────────────────────────────
    init();
  </script>
</body>

</html>
